aid: vids
name: Google Vids
description: >-
  Google Vids is an AI-powered video creation and editing application in
  Google Workspace that enables business users to produce professional
  videos without design expertise by combining Gemini-assisted outlining,
  Veo 3 generative video clips, AI avatars, recording studio capabilities,
  and a royalty-free stock media library. Vids is available on Business
  and Enterprise Workspace plans as well as Google AI Pro and Ultra
  consumer plans, with collaboration handled through standard Workspace
  sharing controls. There is no public developer REST API for Google Vids
  at this time; this index tracks the product as a documentation-only
  reference.
